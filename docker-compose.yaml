services:
  # UCRS Web Application, built from the Dockerfile in this repo.
  ucrs:
    build:
      context: .
      target: dev
    command: sh -c "npm install && npm run dev"
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
      - /app/data
    depends_on:
      mongodb:
        condition: service_healthy
  # MongoDB Community Server
  mongodb:
    image: mongodb/mongodb-community-server:latest
    entrypoint:
      - /bin/sh
      - -ec
      - |
        umask 077
        head -c 512 /dev/urandom | base64 > /tmp/ucrs-mongodb-key
        exec python3 /usr/local/bin/docker-entrypoint.py mongod --config /etc/ucrs-mongod.yaml
    environment:
      MONGODB_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME:-user}"
      MONGODB_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD:-pass}"
      MONGODB_INITDB_REPL_SET_HOST: mongodb:27017
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - ./data:/data/db
      - ./config/mongod.dev.yaml:/etc/ucrs-mongod.yaml:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "const node = db.hello(); quit(node.setName === 'ucrs' && node.isWritablePrimary ? 0 : 1)"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 10s

  # MongoDB Compass Web. 
  compass:
    image: haohanyang/compass-web:0.5.2
    ports:
      - "127.0.0.1:${COMPASS_PORT:-8001}:8080"
    environment:
      CW_APP_NAME: UCRS Compass
      CW_MONGO_URI: "mongodb://${MONGO_INITDB_ROOT_USERNAME:-user}:${MONGO_INITDB_ROOT_PASSWORD:-pass}@mongodb:27017/?authSource=admin&replicaSet=ucrs"
      CW_BASIC_AUTH_USERNAME: "${COMPASS_AUTH_USERNAME:-admin}"
      CW_BASIC_AUTH_PASSWORD: "${COMPASS_AUTH_PASSWORD:-secret}"
      CW_ENABLE_EDIT_CONNECTIONS: "true"
      CW_ENABLE_SHELL: "true"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
